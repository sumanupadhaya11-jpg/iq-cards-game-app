name: Build Android AAB API 35

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: npx cap add android

      - name: Configure Android Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Upgrade Android Gradle Plugin
          root = Path("android")

          build_gradle = root / "build.gradle"
          text = build_gradle.read_text()

          text = re.sub(
              r'com\.android\.tools\.build:gradle:[0-9.]+',
              'com.android.tools.build:gradle:8.6.1',
              text
          )

          build_gradle.write_text(text)

          # Upgrade Gradle wrapper
          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"
          text = wrapper.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip',
              text
          )

          wrapper.write_text(text)

          # API 35
          variables = root / "variables.gradle"

          if variables.exists():
              text = variables.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              variables.write_text(text)

          print("AGP 8.6.1 configured")
          print("Gradle 8.7 configured")
          print("Android API 35 configured")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_id = "ca-app-pub-2783798495093877~9817320811"

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          strings.parent.mkdir(parents=True, exist_ok=True)

          if strings.exists():
              text = strings.read_text()
          else:
              text = "<resources>\n</resources>\n"

          if 'name="admob_app_id"' in text:
              text = re.sub(
                  r'<string name="admob_app_id">.*?</string>',
                  f'<string name="admob_app_id">{app_id}</string>',
                  text
              )
          else:
              text = text.replace(
                  "</resources>",
                  f'    <string name="admob_app_id">{app_id}</string>\n</resources>'
              )

          strings.write_text(text)

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          metadata = (
              '<meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              'android:value="@string/admob_app_id" />'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace(
                  "</application>",
                  f"        {metadata}\n    </application>"
              )

          manifest.write_text(text)

          print("AdMob App ID configured")
          PY

      - name: Set Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")

          text = gradle.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 5',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.0.4"',
              text,
              count=1
          )

          gradle.write_text(text)

          print("Version Code: 5")
          print("Version Name: 1.0.4")
          PY

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iq-cards-game-api35-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
