name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Android API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle"),
              Path("android/build.gradle")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*[=:]?\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*[=:]?\s*\d+',
                  'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*[=:]?\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s*[=:]?\s*\d+',
                  'targetSdk = 35',
                  text
              )

              path.write_text(text)

          # Make sure app module explicitly targets API 35
          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "targetSdkVersion" not in text and "targetSdk" not in text:
                  text = text.replace(
                      "defaultConfig {",
                      "defaultConfig {\n        targetSdkVersion 35",
                      1
                  )

              app.write_text(text)
          PY

      - name: Set Version Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 3',
                  text,
                  count=1
              )

              path.write_text(text)
          PY

      - name: Verify Android Configuration
        run: |
          echo "===== Android SDK configuration ====="
          grep -RniE "compileSdk|targetSdk|versionCode|versionName" android --include="*.gradle" || true

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
