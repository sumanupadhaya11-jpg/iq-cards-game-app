name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update build.gradle API Level
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/app/build.gradle
            sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/targetSdk = 35/targetSdk = 36/g' android/app/build.gradle
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
