name: Build Android AAB API 35

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Upgrade Android Gradle Plugin for API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")

          if not root.exists():
              raise SystemExit("android/build.gradle not found")

          text = root.read_text()

          text = re.sub(
              r'com\.android\.tools\.build:gradle:[0-9.]+',
              'com.android.tools.build:gradle:8.6.1',
              text
          )

          root.write_text(text)

          print("Android Gradle Plugin set to 8.6.1")
          PY

      - name: Set Gradle 8.7
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not p.exists():
              raise SystemExit("gradle-wrapper.properties not found")

          text = p.read_text()

          lines = []
          found = False

          for line in text.splitlines():
              if line.startswith("distributionUrl="):
                  lines.append(
                      "distributionUrl=https\\://services.gradle.org/"
                      "distributions/gradle-8.7-bin.zip"
                  )
                  found = True
              else:
                  lines.append(line)

          if not found:
              lines.append(
                  "distributionUrl=https\\://services.gradle.org/"
                  "distributions/gradle-8.7-bin.zip"
              )

          p.write_text("\n".join(lines) + "\n")

          print("Gradle set to 8.7")
          PY

      - name: Set Android API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle")
          ]

          for file in files:
              if not file.exists():
                  continue

              text = file.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=?\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=?\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s+\d+',
                  'targetSdk 35',
                  text
              )

              file.write_text(text)

          print("compileSdk 35 / targetSdk 35 configured")
          PY

      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_id = "ca-app-pub-2783798495093877~9817320811"

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          strings.parent.mkdir(parents=True, exist_ok=True)

          if strings.exists():
              text = strings.read_text()
          else:
              text = "<resources>\n</resources>\n"

          pattern = r'<string name="admob_app_id">.*?</string>'

          replacement = (
              f'<string name="admob_app_id">{app_id}</string>'
          )

          if re.search(pattern, text):
              text = re.sub(pattern, replacement, text)
          else:
              text = text.replace(
                  "</resources>",
                  f"    {replacement}\n</resources>"
              )

          strings.write_text(text)

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():
              text = manifest.read_text()

              metadata = (
                  '<meta-data '
                  'android:name="com.google.android.gms.ads.APPLICATION_ID" '
                  'android:value="@string/admob_app_id" />'
              )

              if (
                  "com.google.android.gms.ads.APPLICATION_ID"
                  not in text
              ):
                  text = text.replace(
                      "</application>",
                      f"        {metadata}\n    </application>"
                  )

              manifest.write_text(text)

          print("AdMob App ID configured")
          PY

      - name: Set Version Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = gradle.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 5',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.0.4"',
              text,
              count=1
          )

          gradle.write_text(text)

          print("versionCode = 5")
          print("versionName = 1.0.4")
          PY

      - name: Verify Android Setup
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

          echo "API 35 SDK: OK"
          echo "Build Tools 35.0.0: OK"
          echo "Gradle wrapper: OK"
          echo "Manifest: OK"

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iq-cards-game-api35-v1.0.4
          path: android/app/build/outputs/bundle/release/app-release.aab
