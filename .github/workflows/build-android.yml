name: Build Android AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android API 35 OK"
          ls -lh "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Build Web
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Configure API 35
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*[=:]?\s*\d+',
                  lambda m: 'compileSdkVersion 35'
                  if 'build.gradle.kts' not in str(path)
                  else 'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*[=:]?\s*\d+',
                  lambda m: 'targetSdkVersion 35'
                  if 'build.gradle.kts' not in str(path)
                  else 'targetSdk = 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 35',
                  text
              )

              path.write_text(text)

              print("Updated:", path)
          PY

      - name: Show Android configuration
        run: |
          echo "===== Android SDK settings ====="
          grep -RniE "compileSdk|targetSdk" android \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Set Version Code 3
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 3',
                  text,
                  count=1
              )

              path.write_text(text)
              print("Version Code = 3")

          path = Path("android/app/build.gradle.kts")

          if path.exists():
              text = path.read_text()

              text = re.sub(
                  r'versionCode\s*=\s*\d+',
                  'versionCode = 3',
                  text,
                  count=1
              )

              path.write_text(text)
              print("Version Code = 3")
          PY

      - name: Check Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon --stacktrace

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: Verify AAB
        run: |
          if [ ! -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            echo "AAB was not generated."
            exit 1
          fi

          echo "================================"
          echo "AAB BUILD SUCCESSFUL"
          echo "================================"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iq-cards-game-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
