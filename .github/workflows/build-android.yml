name: Build AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v2
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android || true
      - run: |
          echo "plugins { id 'com.android.application' }" > android/app/build.gradle
          echo "android { compileSdk 35; namespace 'com.pointgaming.iqcards'; defaultConfig { applicationId 'com.pointgaming.iqcards'; minSdk 24; targetSdk 35; versionCode 2; versionName '1.0.1' }; buildTypes { release { minifyEnabled false } } }" >> android/app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
