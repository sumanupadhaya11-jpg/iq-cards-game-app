name: Build Android AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android API 35 is installed correctly."

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")

          if variables.exists():
              text = variables.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              if 'compileSdkVersion' not in text:
                  text = text.replace(
                      'ext {',
                      'ext {\n    compileSdkVersion = 35',
                      1
                  )

              if 'targetSdkVersion' not in text:
                  text = text.replace(
                      'ext {',
                      'ext {\n    targetSdkVersion = 35',
                      1
                  )

              variables.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              text = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s+\d+',
                  'targetSdkVersion 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 35',
                  text
              )

              app.write_text(text)

          print("API 35 configuration applied.")
          PY

      - name: Verify SDK Configuration
        run: |
          echo "===== SDK CONFIGURATION ====="
          grep -RniE "compileSdk|targetSdk" android \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Set Version Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()

                  text = re.sub(
                      r'versionCode\s+\d+',
                      'versionCode 3',
                      text,
                      count=1
                  )

                  text = re.sub(
                      r'versionCode\s*=\s*\d+',
                      'versionCode = 3',
                      text,
                      count=1
                  )

                  path.write_text(text)
                  print("Version code set to 3 in", path)

          PY

      - name: Clean Android Project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Check AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB BUILD SUCCESSFUL"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
