name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android API 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "ANDROID API 35 READY"

      - name: Build Web
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for file in files:
              if not file.exists():
                  continue

              text = file.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*[=:]?\s*\d+',
                  'compileSdkVersion 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*[=:]?\s*\d+',
                  'targetSdkVersion 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 35',
                  text
              )

              file.write_text(text)

              print("Updated:", file)
          PY

      - name: Set Version Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/app/build.gradle")

          if file.exists():
              text = file.read_text()
              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 3',
                  text,
                  count=1
              )
              file.write_text(text)

          file = Path("android/app/build.gradle.kts")

          if file.exists():
              text = file.read_text()
              text = re.sub(
                  r'versionCode\s*=\s*\d+',
                  'versionCode = 3',
                  text,
                  count=1
              )
              file.write_text(text)

          print("Version Code = 3")
          PY

      - name: Show SDK Configuration
        run: |
          grep -RniE "compileSdk|targetSdk" android \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          echo "======================================"
          echo "SUCCESS: AAB CREATED"
          echo "======================================"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: IQ-CARDS-GAME-API35-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
