plugins {
    id 'com.android.application'
}

android {
    namespace "com.pointgaming.iqcards"
    compileSdk 36
    
    defaultConfig {
        applicationId "com.pointgaming.iqcards"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
}
