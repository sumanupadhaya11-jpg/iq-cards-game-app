Name: Build Android AAB API 35

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: npx cap add android

      - name: Configure Android Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")

          build_gradle = root / "build.gradle"
          text = build_gradle.read_text()

          text = re.sub(
              r'com\.android\.tools\.build:gradle:[0-9.]+',
              'com.android.tools.build:gradle:8.6.1',
              text
          )

          build_gradle.write_text(text)

          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"
          text = wrapper.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip',
              text
          )

          wrapper.write_text(text)

          variables = root / "variables.gradle"

          if variables.exists():
              text = variables.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              variables.write_text(text)

          print("AGP 8.6.1 configured")
          print("Gradle 8.7 configured")
          print("Android API 35 configured")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob Strings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          
          if not strings_path.parent.exists():
              strings_path.parent.mkdir(parents=True, exist_ok=True)

          admob_tags = '''    <string name="admob_app_id">ca-app-pub-2783798495093877~9817320811</string>
              <string name="admob_banner_id">ca-app-pub-2783798495093877/9110743800</string>
              <string name="admob_rewarded_id">ca-app-pub-2783798495093877/5146734059</string>
              <string name="admob_interstitial_id">ca-app-pub-2783798495093877/5850421576</string>
          '''

          if strings_path.exists():
              content = strings_path.read_text()
              if "</resources>" in content:
                  content = content.replace("</resources>", f"{admob_tags}</resources>")
                  strings_path.write_text(content)
          else:
              xml_content = f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">IQ CARD&#39;S GAME</string>
          {admob_tags}</resources>'''
              strings_path.write_text(xml_content)

          print("AdMob strings injected successfully")
          PY

      - name: Configure AdMob Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          metadata = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", metadata + "\n    </application>")
              manifest.write_text(text)
              print("AdMob meta-data added to manifest")
          else:
              print("AdMob meta-data already present")
          PY

      - name: Set Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 13',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.2"',
              text,
              count=1
          )

          gradle.write_text(text)

          print("Version Code: 13")
          print("Version Name: 1.1.2")
          PY

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iq-cards-game-api35-aab-v13
          path: android/app/build/outputs/bundle/release/app-release.aab
          
