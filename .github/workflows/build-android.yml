name: Build Android AAB API 35

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Node dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove broken SDK 35 and reinstall
        run: |
          rm -rf "$ANDROID_HOME/platforms/android-35"
          rm -rf "$ANDROID_HOME/build-tools/35.0.0"

          yes | sdkmanager --licenses || true

          sdkmanager --update

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android 35
        run: |
          ls -lh "$ANDROID_HOME/platforms/android-35/android.jar"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android API 35 SDK is ready."

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force API 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle")
          ]

          for file in files:
              if not file.exists():
                  continue

              text = file.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=?\s*\d+',
                  'compileSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=?\s*\d+',
                  'targetSdkVersion = 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 35',
                  text
              )

              text = re.sub(
                  r'targetSdk\s+\d+',
                  'targetSdk 35',
                  text
              )

              file.write_text(text)

          print("compileSdk/targetSdk forced to 35")
          PY

      - name: Set version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/app/build.gradle")

          if file.exists():
              text = file.read_text()

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 4',
                  text,
                  count=1
              )

              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.0.3"',
                  text,
                  count=1
              )

              file.write_text(text)

          print("Version Code = 4")
          print("Version Name = 1.0.3")
          PY

      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iq-cards-game-api35-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
